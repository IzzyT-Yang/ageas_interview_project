services:
  postgres:
    image: postgres:16
    container_name: insure4all-postgres
    environment:
      POSTGRES_USER: insure4all
      POSTGRES_PASSWORD: insure4all
      POSTGRES_DB: insure4all
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insure4all -d insure4all"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
